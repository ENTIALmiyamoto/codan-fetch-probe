name: Public rental page comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-rental-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'ENTIALmiyamoto/codan-fetch-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install pinned browser library
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare full resources and listing navigation
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs';
          const origin='https://rent.tokyu-housing-lease.co.jp';
          const detail='/rent/8021383/60618';
          const listing='/rent_search/'+encodeURIComponent('東京都')+'/'+encodeURIComponent('江東区');
          mkdirSync('evidence',{recursive:true});
          const browser=await chromium.launch();
          const results=[];
          const safeUrl=u=>{try{const v=new URL(u);return v.origin+v.pathname;}catch{return 'invalid';}};
          async function inspect(page,label,action,selector){
           const responses=[];
           page.on('response',r=>{if(r.request().isNavigationRequest()&&r.frame()===page.mainFrame()){
           const h=r.headers();responses.push({url:safeUrl(r.url()),status:r.status(),headers:Object.fromEntries(['server','content-type','cf-mitigated','cf-ray','retry-after'].filter(k=>h[k]).map(k=>[k,h[k]]))});}});
           const started=Date.now();
           try{
           await action();
           await page.locator(selector).waitFor({timeout:15000}).catch(()=>{});
           const title=await page.title(), html=await page.content();
           const last=responses.at(-1);
           const denied=responses.some(r=>r.headers['cf-mitigated']==='challenge')||[401,403,429].includes(last?.status)||/just a moment|access denied|forbidden/i.test(title)||/Your request was blocked\./i.test(html);
           const result={label,url:safeUrl(page.url()),title,chars:html.length,selectorFound:await page.locator(selector).count()>0,denied,responses,elapsedMs:Date.now()-started};
           await page.screenshot({path:'evidence/'+label+'.png',fullPage:false});
           results.push(result);return result;
           }catch(e){const result={label,error:e.name,responses,elapsedMs:Date.now()-started};results.push(result);return result;}
          }
          try{
           const b=await browser.newContext();const q=await b.newPage();
           await inspect(q,'02-full-resources',()=>q.goto(origin+detail,{waitUntil:'domcontentloaded',timeout:20000}),'#page_title');
           await b.close();
           await new Promise(r=>setTimeout(r,11000));
           const c=await browser.newContext();const s=await c.newPage();
           const third=await inspect(s,'03-listing',()=>s.goto(origin+listing,{waitUntil:'domcontentloaded',timeout:20000}),'#search_result_num');
           if(third.denied||!third.selectorFound){results.push({decision:'LISTING_UNAVAILABLE_CLICK_NOT_POSSIBLE'});}
           else{
            const link=s.locator('a[href="'+detail+'"],a[href="'+origin+detail+'"]').first();
            if(await link.count()){
             const target=await link.getAttribute('target');
             if(target==='_blank'){
              const popup=c.waitForEvent('page',{timeout:15000});
              await link.click({timeout:15000});
              const p=await popup;
              await inspect(p,'04-detail-click',()=>p.waitForLoadState('domcontentloaded',{timeout:20000}),'#page_title');
             }else await inspect(s,'04-detail-click',()=>link.click({timeout:15000}),'#page_title');
            }else results.push({decision:'TARGET_LINK_NOT_ON_FIRST_PAGE'});
           }
           await c.close();
          }finally{await browser.close();}
          const report={checkedAt:new Date().toISOString(),results};
          writeFileSync('evidence/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## One-room diagnosis\n\n```json\n'+JSON.stringify(report,null,2)+'\n```\n');
          
          JS
      - name: Preserve public-page diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-room-diagnosis
          path: evidence/
          retention-days: 1
